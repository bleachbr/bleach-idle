# Jogo + Caddy (HTTPS automático e gratuito com Let's Encrypt).
# Uso no servidor:  DOMINIO=seu.dominio.com docker compose up -d --build
services:
  jogo:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"       # o Caddy é o único que alcança o jogo: vale o IP que ele repassa em X-Forwarded-For
    volumes:
      - dados:/data            # banco (bleach-idle.sqlite) e backups/
    expose:
      - "2567"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [jogo]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO, ex.: DOMINIO=bleach.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  dados:
  caddy_data:
  caddy_config:
