# Referência do nginx do HOST da VPS. É o mesmo arquivo do bleach-idle (deploy/nginx.conf):
# o domínio, o certificado e a porta 2567 não mudam, então a troca de jogo não pede reload.
server {
    listen 80;
    server_name bleach.acoplum.com www.bleach.acoplum.com;

    location /.well-known/acme-challenge/ {
        root /var/www/bleach-acme;
    }

    location / {
        return 301 https://bleach.acoplum.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bleach.acoplum.com;
    ssl_certificate /etc/letsencrypt/live/bleach.acoplum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bleach.acoplum.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://bleach.acoplum.com$request_uri;
}

server {
    listen 443 ssl;
    server_name bleach.acoplum.com;
    ssl_certificate /etc/letsencrypt/live/bleach.acoplum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bleach.acoplum.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
