server {
    listen 2567;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O Vite põe hash no nome: pode cachear por um ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # textura que falta tem que dar 404, não o index.html com 200
    location /src/assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # trilhas sonoras e efeitos de áudio (dar 404 se faltar)
    location /arts/music/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
