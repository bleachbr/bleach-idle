# Mesmo nome de projeto, serviço e rede do bleach-idle: o `up` troca o container no lugar.
name: bleach
services:
  jogo:
    image: "${BLEACH_IMAGE:?defina BLEACH_IMAGE}"
    restart: unless-stopped
    environment:
      RELEASE_REVISION: "${RELEASE_REVISION:?defina RELEASE_REVISION}"
      RELEASE_DEPLOYED_AT: "${RELEASE_DEPLOYED_AT:?defina RELEASE_DEPLOYED_AT}"
    ports:
      - "127.0.0.1:2567:2567"
    networks: [interna]
    stop_grace_period: 10s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  interna:
    external: true
    name: bleach-interna
