name: bleach
services:
  jogo:
    image: "${BLEACH_IMAGE:?defina BLEACH_IMAGE}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BI_DEV: "0"
      BI_DEBUG: "0"
      TRUST_PROXY: "${TRUST_PROXY:?defina TRUST_PROXY}"
    ports:
      - "127.0.0.1:2567:2567"
    volumes:
      - dados:/data
    networks: [interna]
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  interna:
    external: true
    name: bleach-interna
volumes:
  dados:
    name: bleach-dados
