name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O CI só lê o repositório: nenhum passo precisa de escrita.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    # Inclui o fetch do histórico completo com as fontes de arte; não reduz o escopo da varredura.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan secrets with gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact -c .gitleaks.toml .

  test:
    runs-on: ubuntu-24.04
    # a bateria completa leva cerca de 9 min; o limite impede que um travamento gaste 6 h de execução
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      # actions fixadas por SHA (v7): a tag móvel pode apontar para outro código sem aviso
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run scenario tests
        run: npm run test:scripts

  # testes no navegador (M5-03): o servidor do jogo serve um build próprio, como em produção.
  # Não entra no ruleset nem no deploy no começo: vira obrigatório depois de 2 semanas sem falha aleatória.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm exec -w e2e -- playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: bleach-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build production image
        run: docker build --tag "bleach-idle:$GITHUB_SHA" .
      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/bleach_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          SSH=(ssh -i "$HOME/.ssh/bleach_deploy" -p "${VPS_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST")
          "${SSH[@]}" 'mkdir -p /opt/bleach-idle'
          docker save "bleach-idle:$GITHUB_SHA" | gzip | "${SSH[@]}" 'gunzip | docker load'
          tar -C deploy -czf - compose.vps.yml deploy.sh | "${SSH[@]}" 'tar -xzf - -C /opt/bleach-idle'
          "${SSH[@]}" "bash /opt/bleach-idle/deploy.sh '$GITHUB_SHA'"
          curl --fail --silent --show-error --retry 3 https://bleach.acoplum.com/healthz
