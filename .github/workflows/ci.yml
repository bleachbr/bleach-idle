name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O CI só lê o repositório: nenhum passo precisa de escrita.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # a bateria completa leva cerca de 9 min; o limite impede que um travamento gaste 6 h de execução
    timeout-minutes: 25
    steps:
      # actions fixadas por SHA (v4.4.0): a tag móvel v4 pode apontar para outro código sem aviso
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run scenario tests
        run: npm run test:scripts

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bleach-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production image
        run: docker build --tag "bleach-idle:$GITHUB_SHA" .
      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/bleach_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          SSH=(ssh -i "$HOME/.ssh/bleach_deploy" -p "${VPS_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST")
          "${SSH[@]}" 'mkdir -p /opt/bleach-idle'
          docker save "bleach-idle:$GITHUB_SHA" | gzip | "${SSH[@]}" 'gunzip | docker load'
          tar -C deploy -czf - compose.vps.yml deploy.sh | "${SSH[@]}" 'tar -xzf - -C /opt/bleach-idle'
          "${SSH[@]}" "bash /opt/bleach-idle/deploy.sh '$GITHUB_SHA'"
          curl --fail --silent --show-error --retry 3 https://bleach.acoplum.com/healthz
